[build]
  command = "npm run build"
  publish = "dist/finanzas-app/browser"

# SPA fallback: cualquier ruta interna de Angular Router recarga index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy hacia el backend (si es un sitio Netlify separado con Functions)
[[redirects]]
  from = "/api/*"
  to = "https://finanzas-api.netlify.app/api/:splat"
  status = 200
  force = true
